# EskulHub - Production Nginx Configuration
# High-Performance SPA & Laravel API Reverse Proxy with Gzip/Brotli static support

server {
    listen 80;
    server_name eskulhub.smkn1ciomas.sch.id; # Sesuaikan dengan domain sekolah Anda
    root "C:/Users/Hype AMD/Documents/Documents/Projects/EskulHub/dist";
    index index.html;

    # 1. Kompresi Gzip & Brotli Aktif
    gzip on;
    gzip_static on; # Mengirimkan file .gz yang sudah di-precompress oleh Vite
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;

    # 2. Cache Permanen untuk Aset Frontend Vite (CSS, JS, Fonts)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri $uri.gz $uri.br =404;
    }

    # 3. Routing Frontend Single Page Application (SPA Fallback)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 4. Proxy / FastCGI ke Backend Laravel API
    location /api {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeout & Buffering
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 5. Blokir file tersembunyi (.env, .git)
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
